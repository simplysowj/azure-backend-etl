# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - djangoappcontainer2025unique

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://etlbackendacr.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_2b64850fa88743219557d4c429502fa7 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_d23408a6a4bd4580a802b33e6715f014 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: etlbackendacr.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_2b64850fa88743219557d4c429502fa7 }}/orm1:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'djangoappcontainer2025unique'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_e1e5fd2d73f9465c90c35b33ffe6d507 }}
        images: 'etlbackendacr.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_2b64850fa88743219557d4c429502fa7 }}/orm1:${{ github.sha }}'